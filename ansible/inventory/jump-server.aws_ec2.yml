---
plugin: amazon.aws.aws_ec2
use_deprecated_tags: false

# Use the configured AWS region, with a Mumbai default.
regions:
  - "{{ lookup('env', 'AWS_REGION') | default(lookup('env', 'AWS_DEFAULT_REGION') | default('ap-south-1', true), true) }}"

# Discover only the running jump server belonging to this project.
filters:
  instance-state-name: running
  tag:Name: "{{ lookup('env', 'JUMP_SERVER_NAME') | default('my-devops-lab-learning-jump-server', true) }}"
  tag:Project: "{{ lookup('env', 'PROJECT_NAME') | default('my-devops-lab', true) }}"
  tag:Environment: "{{ lookup('env', 'ENVIRONMENT') | default('learning', true) }}"

hostnames:
  - tag:Name

compose:
  ansible_connection: "'amazon.aws.aws_ssm'"
  ansible_aws_ssm_instance_id: instance_id
  ansible_aws_ssm_region: "lookup('env', 'AWS_REGION') | default(lookup('env', 'AWS_DEFAULT_REGION') | default('ap-south-1', true), true)"
  ansible_aws_ssm_bucket_name: "lookup('env', 'ANSIBLE_AWS_SSM_BUCKET_NAME')"
  ansible_python_interpreter: "'/usr/bin/python3'"

groups:
  jump_servers: ec2_tags.Name is defined
