---
- name: Detect EC2 architecture for AWS CLI
  ansible.builtin.set_fact:
    aws_cli_arch: >-
      {{ 'x86_64' if ansible_facts['architecture'] == 'x86_64'
         else 'aarch64' if ansible_facts['architecture'] in ['aarch64', 'arm64']
         else 'unsupported' }}

- name: Validate supported AWS CLI architecture
  ansible.builtin.assert:
    that:
      - aws_cli_arch != 'unsupported'
    success_msg: "Supported AWS CLI architecture: {{ aws_cli_arch }}"
    fail_msg: "Unsupported EC2 architecture for AWS CLI."

- name: Check whether AWS CLI is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/aws
  register: aws_cli_binary

- name: Download AWS CLI v2 installer
  ansible.builtin.get_url:
    url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ aws_cli_arch }}.zip"
    dest: /tmp/awscliv2.zip
    mode: '0644'
  when: not aws_cli_binary.stat.exists

- name: Extract AWS CLI installer
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp/
    remote_src: true
    creates: /tmp/aws/install
  when: not aws_cli_binary.stat.exists

- name: Install AWS CLI v2
  ansible.builtin.command:
    cmd: /tmp/aws/install --install-dir /usr/local/aws-cli --bin-dir /usr/local/bin
    creates: /usr/local/bin/aws
  when: not aws_cli_binary.stat.exists

- name: Verify AWS CLI version
  ansible.builtin.command: /usr/local/bin/aws --version
  register: aws_cli_version
  changed_when: false

- name: Display AWS CLI version
  ansible.builtin.debug:
    msg: "{{ aws_cli_version.stdout }}"
