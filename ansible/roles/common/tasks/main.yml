---
- name: Update Ubuntu package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common DevOps prerequisites
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - unzip
      - jq
      - ca-certificates
      - gnupg
      - software-properties-common
    state: present
